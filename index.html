<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Maquinaria</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a4a5e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#f2f1ea; --panel:#ffffff; --ink:#2a2a24; --muted:#6b6b60;
    --accent:#2a4a5e; --accent2:#3d6a86;
    --amarillo:#c98a12; --verde:#46562a; --rojo:#7a2a12;
    --borde:#dedad0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:40px;}
  header{background:var(--accent);color:#fff;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;margin:0;font-weight:700;}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .oculto{display:none !important;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tarjeta{background:var(--panel);border:1px solid var(--borde);border-radius:16px;
    padding:20px 12px;text-align:center;font-size:16px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .tarjeta .ico{font-size:32px;}
  .tarjeta small{font-weight:400;color:var(--muted);font-size:12px;}

  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;
    font-size:17px;font-weight:700;color:#fff;background:var(--accent);
    margin-bottom:12px;}
  .btn.grande{padding:26px;font-size:20px;}
  .btn.secundario{background:var(--accent2);}
  .btn.verde{background:var(--verde);}
  .btn.rojo{background:var(--rojo);}
  .btn.amarillo{background:var(--amarillo);}
  .btn.chico{padding:10px;font-size:14px;margin-bottom:0;}
  .btn.fantasma{background:transparent;color:var(--accent);border:1px solid var(--accent);}
  .btn:active{opacity:.8;}

  .volver{background:none;border:none;color:var(--accent);font-size:15px;
    font-weight:700;padding:8px 0 16px;display:flex;align-items:center;gap:4px;}

  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;
    font-weight:600;}
  .campo input[type=text], .campo input[type=number], .campo textarea, .campo select{
    width:100%;padding:14px;border:1px solid var(--borde);border-radius:10px;
    font-size:16px;background:#fff;}
  .campo textarea{min-height:80px;resize:vertical;}
  .campo input[type=number]{font-size:24px;font-weight:700;text-align:center;}

  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:12px 14px;border:1px solid var(--borde);border-radius:999px;
    background:#fff;font-size:14px;font-weight:600;}
  .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent);}

  .maquinas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .maquinas .chip{border-radius:10px;text-align:center;padding:14px 6px;}

  .lista{margin-top:16px;}
  .item{background:var(--panel);border:1px solid var(--borde);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;}
  .item .fila1{display:flex;justify-content:space-between;font-size:13px;
    color:var(--muted);margin-bottom:4px;}
  .item .titulo{font-weight:700;font-size:15px;}
  .item .desc{font-size:14px;color:#444;margin-top:4px;}
  .item img{max-width:100%;border-radius:8px;margin-top:8px;display:block;}

  .tarea{background:var(--panel);border:1px solid var(--borde);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;}
  .tarea .check{width:26px;height:26px;border-radius:50%;border:2px solid #c7c4b8;
    flex:0 0 auto;margin-top:2px;background:#fff;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:15px;font-weight:700;}
  .tarea.hecha .check{background:var(--accent2);border-color:var(--accent2);}
  .tarea .cont{flex:1;min-width:0;}
  .tarea .txt{font-size:15px;font-weight:600;margin-top:6px;}
  .tarea .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .tarea img{max-width:100%;border-radius:8px;margin-top:8px;}

  .cat-pill{display:inline-block;padding:4px 10px;border-radius:999px;
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .cat-rep{background:#e2ecf3;color:#2a5878;}
  .cat-lab{background:#e3f0e0;color:#2f7a3d;}
  .cat-log{background:#f7e8d4;color:#a8641a;}
  .cat-otros{background:#eae8e0;color:#6b6b60;}
  .cat-gan{background:#f3e2e2;color:#8a3a3a;}

  .tarea.soloLectura{opacity:.9;}
  .origen-tag{font-size:11px;color:var(--accent2);font-weight:700;margin-top:4px;}

  .seccion-tit{font-size:14px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.03em;margin:20px 0 8px;}

  .grupo-tit{display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.02em;
    margin:16px 0 8px;cursor:pointer;}
  .grupo-tit.pendiente{background:#faf1d6;color:#8a6a12;}
  .grupo-tit.hecha{background:#e3f0e0;color:#2f7a3d;}
  .grupo-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;color:#fff;flex:0 0 auto;}
  .grupo-tit.pendiente .grupo-num{background:#c98a12;}
  .grupo-tit.hecha .grupo-num{background:#46562a;}
  .grupo-flecha{margin-left:auto;transition:transform .15s;}
  .grupo-tit.colapsado .grupo-flecha{transform:rotate(-90deg);}

  .preview{width:100%;border-radius:12px;margin-bottom:12px;display:none;}
  input[type=file]{display:none;}
  .btn-foto{background:#fff;border:2px dashed var(--borde);color:var(--muted);
    border-radius:14px;padding:24px;text-align:center;font-weight:700;margin-bottom:16px;}

  .toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:520px;margin:0 auto;
    background:var(--ink);color:#fff;padding:14px 18px;border-radius:12px;
    font-size:14px;text-align:center;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2);}

</style>
</head>
<body>

<header>
  <h1>🔧 Maquinaria</h1>
</header>

<main>

  <!-- ===================== HOME ===================== -->
  <section id="vHome">
    <div class="grid2">
      <div class="tarjeta" onclick="ir('combustible')">
        <div class="ico">⛽</div>Combustible<small>cargar o llegada al galpón</small>
      </div>
      <div class="tarjeta" onclick="ir('remitos')">
        <div class="ico">🧾</div>Remitos<small>sacale foto y subilo</small>
      </div>
      <div class="tarjeta" onclick="ir('tareas')">
        <div class="ico">✅</div>Tareas<small id="contTareas">a hacer y hechas</small>
      </div>
    </div>
  </section>

  <!-- ===================== COMBUSTIBLE ===================== -->
  <section id="vCombustible" class="oculto">
    <button class="volver" onclick="ir('home')">‹ Volver</button>

    <div id="combPaso1">
      <button class="btn grande verde" onclick="combElegirTipo('Carga a máquina')">⛽ Cargar a una máquina</button>
      <button class="btn grande secundario" onclick="combElegirTipo('Llegada al galpón')">🛢️ Llegó combustible al galpón</button>

      <div class="seccion-tit">Últimas cargas</div>
      <div class="lista" id="listaCombustible"></div>
    </div>

    <div id="combPaso2" class="oculto">
      <button class="volver" onclick="volverCombPaso1()">‹ Volver</button>
      <p style="font-weight:700;font-size:16px;" id="combTituloTipo"></p>

      <div class="campo oculto" id="combCampoMaquina">
        <label>Máquina</label>
        <div class="maquinas" id="chipsMaquinasComb"></div>
      </div>

      <div class="campo">
        <label>Litros</label>
        <input type="number" id="combLitros" inputmode="decimal" placeholder="0">
      </div>

      <button class="btn grande" onclick="guardarCombustibleUI(this)">Guardar</button>
    </div>
  </section>

  <!-- ===================== REMITOS ===================== -->
  <section id="vRemitos" class="oculto">
    <button class="volver" onclick="ir('home')">‹ Volver</button>

    <label class="btn-foto" id="remBtnFoto">
      📷 Tocá para sacar o elegir la foto del remito
      <input type="file" id="remInput" accept="image/*" capture="environment" onchange="remFotoElegida(event)">
    </label>
    <img id="remPreview" class="preview">

    <div id="remLeyendo" class="oculto" style="text-align:center;color:var(--muted);font-weight:700;margin-bottom:16px;">
      🔎 Leyendo el remito...
    </div>

    <div id="remCampos" class="oculto">
      <div class="campo">
        <label>Fecha</label>
        <input type="text" id="remFecha" placeholder="AAAA-MM-DD">
      </div>
      <div class="campo">
        <label>Proveedor</label>
        <input type="text" id="remProveedor" placeholder="Comercio o proveedor">
      </div>
      <div class="campo">
        <label>Monto</label>
        <input type="number" id="remMonto" inputmode="decimal" placeholder="0">
      </div>
      <div class="campo">
        <label>Ítems / detalle</label>
        <textarea id="remDescripcion" placeholder="Qué se compró..."></textarea>
      </div>

      <button class="btn grande" onclick="guardarRemitoUI(this)">Subir remito</button>
    </div>

    <div class="seccion-tit">Últimos remitos</div>
    <div class="lista" id="listaRemitos"></div>
  </section>

  <!-- ===================== TAREAS ===================== -->
  <section id="vTareas" class="oculto">

    <!-- --- lista (pantalla por defecto) --- -->
    <div id="tarPaso1">
      <button class="volver" onclick="ir('home')">‹ Volver</button>

      <button class="btn grande verde" onclick="irNuevaTarea()">+ Nueva</button>

      <div class="grupo-tit pendiente" id="titPend" onclick="toggleGrupo('Pend')">
        <span class="grupo-num" id="numPend">0</span>
        <span id="txtPend">PENDIENTES</span>
        <span class="grupo-flecha" id="flechaPend">▾</span>
      </div>
      <div class="lista" id="listaTareasPend"></div>

      <div class="grupo-tit hecha" id="titHechas" onclick="toggleGrupo('Hechas')">
        <span class="grupo-num" id="numHechas">0</span>
        <span id="txtHechas">COMPLETADAS</span>
        <span class="grupo-flecha" id="flechaHechas">▾</span>
      </div>
      <div class="lista" id="listaTareasHechas"></div>
    </div>

    <!-- --- crear (pantalla separada, no expandible arriba de la lista) --- -->
    <div id="tarPaso2" class="oculto">
      <button class="volver" onclick="volverTarPaso1()">‹ Volver</button>

      <div class="campo">
        <label>¿Qué hay que hacer / qué se hizo?</label>
        <textarea id="tarTexto" placeholder="Descripción..."></textarea>
      </div>

      <div class="campo">
        <label>Máquina / equipo (opcional)</label>
        <input type="text" id="tarMaquina" placeholder="Ej: Pauny, New Holland TJ240...">
      </div>

      <div class="campo">
        <label>Categoría</label>
        <div class="chips" id="chipsCategoriaTarea"></div>
      </div>

      <label class="btn-foto" id="tarBtnFoto">
        📷 Agregar foto (opcional)
        <input type="file" id="tarInput" accept="image/*" capture="environment" onchange="tarFotoElegida(event)">
      </label>
      <img id="tarPreview" class="preview">

      <div class="campo">
        <label>¿Ya está hecho?</label>
        <div class="chips">
          <button type="button" class="chip" id="tarHechaNo" onclick="tarElegirHecha(false)">No, queda pendiente</button>
          <button type="button" class="chip" id="tarHechaSi" onclick="tarElegirHecha(true)">Sí, ya se hizo</button>
        </div>
      </div>

      <button class="btn grande" id="tarBtnGuardar" onclick="guardarTareaUI(this)">Guardar</button>
    </div>
  </section>

</main>

<div id="toast" class="toast oculto"></div>

<script>
/* ====================== CONFIGURACIÓN ====================== */
var BACKEND = 'https://script.google.com/macros/s/AKfycbxVQIf6LaUN0HNzIuTumP5FjF16CHCjLVoaWZA0hQMFHJRjZDGduCWindkiRfDfn3Y9EA/exec';

// Sin nombre por ahora: se saca a propósito hasta que haya login real por
// persona. El "quién" en la planilla queda vacío mientras tanto.
var CATEGORIAS_TAREA = [
  { nombre: 'Reparación y Mantenimiento', clase: 'cat-rep' },
  { nombre: 'Laboreo y Agricultura', clase: 'cat-lab' },
  { nombre: 'Logística y mantenimiento de granos', clase: 'cat-log' },
  { nombre: 'Labores Ganadería', clase: 'cat-gan' },
  { nombre: 'Otros', clase: 'cat-otros' }
];
var CATEGORIA_DEFAULT = 'Otros';

function claseCategoria_(nombre) {
  var c = CATEGORIAS_TAREA.filter(function (c) { return c.nombre === nombre; })[0];
  return c ? c.clase : 'cat-otros';
}

// Backend de Sanidad/Ganadería: mismo patrón doPost, sin sesión para esta
// única función de solo lectura. Ver getReparacionesPublico() en su Codigo.gs.
var GANADERIA_BACKEND = 'https://script.google.com/macros/s/AKfycby0vYipnm6pAt5EXKS3UUlCjORFrLe1FhbbFtq5Dt5EN778fW1VLuBYrPKwehvlXKRiBA/exec';

/* ====================== ESTADO ====================== */
var estado = {
  maquinas: [],
  combTipo: '',
  combMaquina: '',
  remFotoDataUrl: '',
  tarFotoDataUrl: '',
  tarCategoriaSel: CATEGORIA_DEFAULT, // "Otros" por defecto, así nunca queda vacía
  tarHechaSel: false,
  gruposAbiertos: { Pend: true, Hechas: true }
};

/* ====================== ARRANQUE ====================== */
document.addEventListener('DOMContentLoaded', function () {
  ir('home');
  cargarMaquinas();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
});

/* ====================== NAVEGACIÓN ====================== */
var VISTAS = ['home', 'combustible', 'remitos', 'tareas'];

function ir(vista) {
  VISTAS.forEach(function (v) {
    document.getElementById('v' + capitaliza_(v)).classList.add('oculto');
  });
  document.getElementById('v' + capitaliza_(vista)).classList.remove('oculto');

  if (vista === 'combustible') { volverCombPaso1(); cargarCombustible(); }
  if (vista === 'remitos') { cargarRemitos(); }
  if (vista === 'tareas') { volverTarPaso1(); cargarTareas(); }
}

function capitaliza_(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ====================== LLAMADAS AL BACKEND ====================== */
function llamar(fn, args) {
  return fetch(BACKEND, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    if (!j.ok) throw new Error(j.error || 'Error');
    return j.r;
  });
}

/** Mismo patrón, pero contra el backend de Sanidad/Ganadería (solo lectura). */
function llamarGanaderia(fn, args) {
  return fetch(GANADERIA_BACKEND, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  })
  .then(function (r) { return r.json(); })
  .then(function (j) {
    if (!j.ok) throw new Error(j.error || 'Error');
    return j.r;
  });
}

function mostrarToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('oculto');
  setTimeout(function () { t.classList.add('oculto'); }, 2500);
}

/**
 * Deshabilita el botón y le cambia el texto mientras la promesa está en
 * vuelo, así queda claro que algo está pasando y no que se colgó — Apps
 * Script a veces tarda unos segundos en la primera llamada.
 */
function conCarga_(btn, textoCarga, promesa) {
  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = textoCarga;
  return promesa.finally(function () {
    btn.disabled = false;
    btn.textContent = original;
  });
}

/* ====================== MÁQUINAS ====================== */
function cargarMaquinas() {
  llamar('getMaquinas').then(function (r) {
    estado.maquinas = r || [];
  }).catch(function () {});
}

function renderChipsMaquinas_(contId, onClick, seleccionada) {
  var cont = document.getElementById(contId);
  cont.innerHTML = '';
  estado.maquinas.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'chip' + (m.nombre === seleccionada ? ' sel' : '');
    b.textContent = m.nombre;
    b.onclick = function () { onClick(m.nombre); };
    cont.appendChild(b);
  });
}

/* ====================== COMBUSTIBLE ====================== */
function combElegirTipo(tipo) {
  estado.combTipo = tipo;
  estado.combMaquina = '';
  document.getElementById('combPaso1').classList.add('oculto');
  document.getElementById('combPaso2').classList.remove('oculto');
  document.getElementById('combTituloTipo').textContent = tipo === 'Carga a máquina'
    ? '⛽ Cargando a una máquina' : '🛢️ Llegada al galpón';
  document.getElementById('combLitros').value = '';

  var campoMaq = document.getElementById('combCampoMaquina');
  if (tipo === 'Carga a máquina') {
    campoMaq.classList.remove('oculto');
    renderChipsMaquinasComb_();
  } else {
    campoMaq.classList.add('oculto');
  }
}

function renderChipsMaquinasComb_() {
  renderChipsMaquinas_('chipsMaquinasComb', function (n) {
    estado.combMaquina = n;
    renderChipsMaquinasComb_();
  }, estado.combMaquina);
}

function volverCombPaso1() {
  document.getElementById('combPaso1').classList.remove('oculto');
  document.getElementById('combPaso2').classList.add('oculto');
}

function guardarCombustibleUI(btn) {
  var litros = document.getElementById('combLitros').value;
  if (!litros || Number(litros) <= 0) { mostrarToast('Falta la cantidad'); return; }
  if (estado.combTipo === 'Carga a máquina' && !estado.combMaquina) { mostrarToast('Elegí la máquina'); return; }

  conCarga_(btn, 'Guardando...', llamar('guardarCombustible', [{
    tipo: estado.combTipo, maquina: estado.combMaquina,
    litros: litros, quien: ''
  }])).then(function () {
    mostrarToast('Guardado ✓');
    volverCombPaso1();
    cargarCombustible();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

function cargarCombustible() {
  llamar('getCombustible', [15]).then(function (r) {
    var cont = document.getElementById('listaCombustible');
    cont.innerHTML = '';
    (r || []).forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<div class="fila1"><span>' + fFecha_(c.fecha) + '</span><span>' + (c.quien || '') + '</span></div>' +
        '<div class="titulo">' + c.litros + ' L — ' + c.tipo + (c.maquina ? ' · ' + c.maquina : '') + '</div>';
      cont.appendChild(div);
    });
  }).catch(function () {});
}

/* ====================== REMITOS ====================== */
function remFotoElegida(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  comprimirImagen_(file, function (dataUrl) {
    estado.remFotoDataUrl = dataUrl;
    var img = document.getElementById('remPreview');
    img.src = dataUrl;
    img.style.display = 'block';

    // Fecha de hoy como default, por si la lectura automática falla o no la trae.
    document.getElementById('remFecha').value = new Date().toISOString().slice(0, 10);
    document.getElementById('remProveedor').value = '';
    document.getElementById('remMonto').value = '';
    document.getElementById('remDescripcion').value = '';

    document.getElementById('remCampos').classList.remove('oculto');
    document.getElementById('remLeyendo').classList.remove('oculto');

    llamar('leerRemito', [dataUrl]).then(function (r) {
      var l = (r && r.lectura) || {};
      if (l.fecha) document.getElementById('remFecha').value = l.fecha;
      if (l.proveedor) document.getElementById('remProveedor').value = l.proveedor;
      if (l.monto) document.getElementById('remMonto').value = l.monto;
      if (l.items) document.getElementById('remDescripcion').value = l.items;
      document.getElementById('remLeyendo').classList.add('oculto');
      mostrarToast('Leído ✓ — revisá y corregí si hace falta');
    }).catch(function (e) {
      document.getElementById('remLeyendo').classList.add('oculto');
      mostrarToast('No se pudo leer solo (' + e.message + ') — completá a mano');
    });
  });
}

function guardarRemitoUI(btn) {
  if (!estado.remFotoDataUrl) { mostrarToast('Sacá la foto primero'); return; }

  var fecha = document.getElementById('remFecha').value;
  var proveedor = document.getElementById('remProveedor').value;
  var monto = document.getElementById('remMonto').value;
  var desc = document.getElementById('remDescripcion').value;

  conCarga_(btn, 'Subiendo...', llamar('subirRemito', [{
    foto: estado.remFotoDataUrl, fecha: fecha, proveedor: proveedor,
    monto: monto, descripcion: desc, quien: ''
  }])).then(function () {
    mostrarToast('Remito subido ✓');
    estado.remFotoDataUrl = '';
    document.getElementById('remPreview').style.display = 'none';
    document.getElementById('remCampos').classList.add('oculto');
    document.getElementById('remFecha').value = '';
    document.getElementById('remProveedor').value = '';
    document.getElementById('remMonto').value = '';
    document.getElementById('remDescripcion').value = '';
    document.getElementById('remInput').value = '';
    cargarRemitos();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

function cargarRemitos() {
  llamar('getRemitos', [10]).then(function (r) {
    var cont = document.getElementById('listaRemitos');
    cont.innerHTML = '';
    (r || []).forEach(function (rem) {
      var div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<div class="fila1"><span>' + fFecha_(rem.fecha) + '</span><span>' + (rem.quien || '') + '</span></div>' +
        '<div class="titulo">' + escHtml_(rem.proveedor || 'Sin proveedor') +
          (rem.monto ? ' — $' + rem.monto : '') + '</div>' +
        (rem.descripcion ? '<div class="desc">' + escHtml_(rem.descripcion) + '</div>' : '') +
        (rem.foto ? '<img src="' + rem.foto + '">' : '');
      cont.appendChild(div);
    });
  }).catch(function () {});
}

/* ====================== TAREAS ====================== */

/* --- navegación entre lista y creación: pasos separados, no un acordeón
   arriba de la lista, para que crear no reordene nada bajo el dedo --- */
function irNuevaTarea() {
  document.getElementById('tarPaso1').classList.add('oculto');
  document.getElementById('tarPaso2').classList.remove('oculto');

  document.getElementById('tarTexto').value = '';
  document.getElementById('tarMaquina').value = '';
  document.getElementById('tarPreview').style.display = 'none';
  document.getElementById('tarInput').value = '';
  estado.tarFotoDataUrl = '';
  estado.tarCategoriaSel = CATEGORIA_DEFAULT;
  estado.tarHechaSel = false;
  renderChipsCategoriaTarea();
  renderTarHechaBtns();
}

function volverTarPaso1() {
  document.getElementById('tarPaso1').classList.remove('oculto');
  document.getElementById('tarPaso2').classList.add('oculto');
}

function renderChipsCategoriaTarea() {
  var cont = document.getElementById('chipsCategoriaTarea');
  cont.innerHTML = '';
  CATEGORIAS_TAREA.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip' + (c.nombre === estado.tarCategoriaSel ? ' sel' : '');
    b.textContent = c.nombre;
    b.onclick = function () {
      estado.tarCategoriaSel = c.nombre;  // siempre una elegida, no se puede deseleccionar
      renderChipsCategoriaTarea();
    };
    cont.appendChild(b);
  });
}

function tarElegirHecha(hecha) {
  estado.tarHechaSel = hecha;
  renderTarHechaBtns();
}

function renderTarHechaBtns() {
  document.getElementById('tarHechaNo').classList.toggle('sel', !estado.tarHechaSel);
  document.getElementById('tarHechaSi').classList.toggle('sel', estado.tarHechaSel);
}

function tarFotoElegida(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  comprimirImagen_(file, function (dataUrl) {
    estado.tarFotoDataUrl = dataUrl;
    var img = document.getElementById('tarPreview');
    img.src = dataUrl;
    img.style.display = 'block';
  });
}

function guardarTareaUI(btn) {
  var texto = document.getElementById('tarTexto').value.trim();
  if (!texto) { mostrarToast('Escribí qué hay que hacer'); return; }
  var maquina = document.getElementById('tarMaquina').value.trim();

  conCarga_(btn, 'Guardando...', llamar('crearTarea', [{
    texto: texto, maquina: maquina, categoria: estado.tarCategoriaSel,
    foto: estado.tarFotoDataUrl, yaHecha: estado.tarHechaSel, quien: ''
  }])).then(function () {
    mostrarToast(estado.tarHechaSel ? 'Cargado como hecho ✓' : 'Tarea creada ✓');
    volverTarPaso1();
    cargarTareas();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

function toggleGrupo(clave) {
  estado.gruposAbiertos[clave] = !estado.gruposAbiertos[clave];
  document.getElementById('lista' + (clave === 'Pend' ? 'TareasPend' : 'TareasHechas'))
    .classList.toggle('oculto', !estado.gruposAbiertos[clave]);
  document.getElementById('tit' + (clave === 'Pend' ? 'Pend' : 'Hechas'))
    .classList.toggle('colapsado', !estado.gruposAbiertos[clave]);
}

/** Reparaciones de Sanidad/Ganadería, traducidas a la misma forma que una tarea local. */
function mapearReparacionGanaderia_(r) {
  return {
    id: 'GAN-' + r.id,
    texto: (r.tipo ? r.tipo + ': ' : '') + (r.que || ''),
    maquina: [r.campo, r.donde].filter(Boolean).join(' — '),
    categoria: 'Labores Ganadería',
    foto: r.foto || '',
    estado: r.estado === 'Resuelto' ? 'Hecha' : 'Pendiente',
    creadaPor: r.responsable || '',
    creadaEl: r.fecha || '',
    hechaPor: r.resueltoPor || '',
    hechaEl: r.resueltoEl || '',
    origen: 'ganaderia'
  };
}

function cargarTareas() {
  var propias = llamar('getTareas').catch(function () { return []; });
  var ganaderia = llamarGanaderia('getReparacionesPublico')
    .then(function (r) { return (r || []).map(mapearReparacionGanaderia_); })
    .catch(function () { return []; }); // si Ganadería no responde, se ve igual lo propio

  Promise.all([propias, ganaderia]).then(function (res) {
    var r = (res[0] || []).concat(res[1] || []);
    var pend = r.filter(function (t) { return t.estado === 'Pendiente'; });
    var hechas = r.filter(function (t) { return t.estado !== 'Pendiente'; });

    document.getElementById('contTareas').textContent = pend.length
      ? pend.length + ' pendiente' + (pend.length === 1 ? '' : 's')
      : 'a hacer y hechas';

    document.getElementById('numPend').textContent = pend.length;
    document.getElementById('txtPend').textContent = pend.length === 1 ? 'PENDIENTE' : 'PENDIENTES';
    document.getElementById('numHechas').textContent = hechas.length;
    document.getElementById('txtHechas').textContent = hechas.length === 1 ? 'COMPLETADA' : 'COMPLETADAS';

    var contP = document.getElementById('listaTareasPend');
    contP.innerHTML = pend.length ? '' : '<p style="color:var(--muted);font-size:14px;">Sin pendientes.</p>';
    pend.forEach(function (t) { contP.appendChild(renderTarea_(t, false)); });

    var contH = document.getElementById('listaTareasHechas');
    contH.innerHTML = hechas.length ? '' : '<p style="color:var(--muted);font-size:14px;">Nada todavía.</p>';
    hechas.forEach(function (t) { contH.appendChild(renderTarea_(t, true)); });
  });
}

function renderTarea_(t, hecha) {
  var deGanaderia = t.origen === 'ganaderia';
  var div = document.createElement('div');
  div.className = 'tarea' + (hecha ? ' hecha' : '') + (deGanaderia ? ' soloLectura' : '');

  var check = document.createElement('div');
  check.className = 'check';
  check.textContent = hecha ? '✓' : '';
  if (deGanaderia) {
    check.style.opacity = '.5';
    check.title = 'Se resuelve desde la app de Ganadería';
  } else {
    check.title = hecha ? 'Reabrir' : 'Marcar como hecha';
    check.onclick = function () {
      if (hecha) { reabrirTareaUI(t.id); } else { marcarHechaUI(t.id); }
    };
  }

  var categoria = t.categoria || 'Otros';
  var cont = document.createElement('div');
  cont.className = 'cont';
  cont.innerHTML =
    '<span class="cat-pill ' + claseCategoria_(categoria) + '">' + escHtml_(categoria) + '</span>' +
    '<div class="txt">' + escHtml_(t.texto) + '</div>' +
    (t.maquina ? '<div class="meta">' + escHtml_(t.maquina) + '</div>' : '') +
    '<div class="meta">' + (hecha
      ? 'Hecha' + (t.hechaPor ? ' por ' + escHtml_(t.hechaPor) : '') + ' · ' + fFecha_(t.hechaEl)
      : 'Creada · ' + fFecha_(t.creadaEl)) + '</div>' +
    (deGanaderia ? '<div class="origen-tag">🐄 desde Ganadería — se resuelve ahí</div>' : '') +
    (t.foto ? '<img src="' + t.foto + '">' : '');

  if (!deGanaderia) {
    var borrar = document.createElement('button');
    borrar.className = 'btn chico fantasma';
    borrar.style.marginTop = '8px';
    borrar.textContent = 'Borrar';
    borrar.onclick = function (ev) { ev.stopPropagation(); borrarTareaUI(t.id); };
    cont.appendChild(borrar);
  }

  div.appendChild(check);
  div.appendChild(cont);
  return div;
}

function marcarHechaUI(id) {
  llamar('marcarTareaHecha', [id, '']).then(function () {
    mostrarToast('Marcada como hecha ✓');
    cargarTareas();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

function reabrirTareaUI(id) {
  llamar('reabrirTarea', [id]).then(function () {
    mostrarToast('Reabierta ✓');
    cargarTareas();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

function borrarTareaUI(id) {
  if (!confirm('¿Borrar esta tarea? No se puede deshacer.')) return;
  llamar('borrarTarea', [id]).then(function () {
    mostrarToast('Borrada ✓');
    cargarTareas();
  }).catch(function (e) { mostrarToast('Error: ' + e.message); });
}

/* ====================== UTILIDADES ====================== */

/** Achica la foto a 1400px antes de mandarla: una foto de celular pesa varios MB
 * y en el campo la señal no da abasto para subirla entera. */
function comprimirImagen_(file, cb) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var max = 1400;
      var w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function fFecha_(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[2] + '/' + p[1] + '/' + p[0].slice(2);
}

function escHtml_(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
